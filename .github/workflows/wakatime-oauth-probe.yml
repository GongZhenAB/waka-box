name: WakaTime OAuth probe

on:
  push:
    branches:
      - test/wakatime-oauth-probe-20261124

permissions:
  contents: read

jobs:
  verify-wakatime-oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install existing WakaTime client
        run: npm ci --ignore-scripts
      - name: Verify OAuth token with the same client used by waka-box
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          node <<'NODE'
          const { WakaTimeClient, RANGE } = require("wakatime-client");
          const client = new WakaTimeClient(process.env.WAKATIME_API_KEY);
          client.getMyStats({ range: RANGE.LAST_7_DAYS })
            .then((result) => {
              const data = result && result.data;
              if (!data || !Array.isArray(data.languages)) {
                throw new Error("WakaTime returned no usable stats payload");
              }
              console.log("WakaTime OAuth request succeeded.");
              console.log("Languages returned:", data.languages.length);
              console.log("Total coding time:", data.human_readable_total || data.text || "available");
            })
            .catch((error) => {
              const status = error && (error.status || (error.response && error.response.status));
              console.error("WakaTime request failed:", status || "unknown status", error && error.message);
              process.exitCode = 1;
            });
          NODE
